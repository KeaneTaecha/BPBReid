data:
  root: '/home/kunanont/BPBReid/datasets'
  sources: ['market1501']
  targets: ['market1501']
  height: 384
  width: 128
  transforms: ['rc', 're']

model:
  name: 'bpbreid'
  load_weights: 'pretrained_models/bpbreid_market1501_hrnet32_10642.pth'
  load_config: True
  bpbreid:
    mask_filtering_training: False
    mask_filtering_testing: True
    learnable_attention_enabled: True
    backbone: 'hrnet32'
    test_embeddings: ['bn_foreg', 'parts']
    masks:
      dir: 'pifpaf_maskrcnn_filtering'
      preprocess: 'five_v'
      # parts_num: 5  # Added this line
      # parts_names: ['head_mask', 'upper_arms_torso_mask', 'lower_arms_torso_mask', 'legs_mask', 'feet_mask']  # Added this line

test:
  evaluate: True
  batch_size: 64
  visrank: True
